name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BaonTracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Appetize
        env:
          APPETIZE_API_KEY: ${{ secrets.APPETIZE_API_KEY }}
        run: |
          if [ -z "$APPETIZE_API_KEY" ]; then
            echo "No APPETIZE_API_KEY secret set, skipping Appetize upload."
            exit 0
          fi
          # Updates the same Appetize app each time instead of making a new one.
          curl -sS -o /dev/null -w "Appetize upload: HTTP %{http_code}\n" -X POST \
            https://api.appetize.io/v1/apps/whfzojbwx4qryt4hk4cg6vefkm \
            -H "X-API-KEY: $APPETIZE_API_KEY" \
            -F "file=@app/build/outputs/apk/debug/app-debug.apk" \
            -F "platform=android"
